[package]
name = "transslater"
version = "0.1.0"
description = "tranSSlater — 桌面翻译器"
authors = ["renschekhe"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "transslater_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# 划词翻译时，第二次启动（例如从资源管理器右键菜单调用）把参数转发给已在运行的实例
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Google 翻译接口
reqwest = { version = "0.12", features = ["json", "socks"] }
url = "2"
tokio = { version = "1", features = ["time"] }
thiserror = "2"

# 驱动抽象
async-trait = "0.1"

# 历史库：bundled 自带 SQLite 源码，不依赖系统库
rusqlite = { version = "0.40", features = ["bundled"] }

# 导出时格式化本地时间
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# 读文本文件时识别 UTF-8 / UTF-16 / GBK（reqwest 已经间接依赖，这里只是显式声明）
encoding_rs = "0.8"

# 划词翻译：低级鼠标钩子、UI Automation 取词、剪贴板兜底、显示器工作区
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Storage_EnhancedStorage",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
] }
# 资源管理器右键菜单项写在 HKCU\Software\Classes，不需要管理员权限
windows-registry = "0.6"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
