[package]
name = "transslater"
version = "0.1.0"
description = "tranSSlater — Android 翻译器"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# `_lib` 后缀是为了让 lib 名与 bin 名不冲突；`staticlib` 是 Android 目标必须的。
name = "transslater_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Google 翻译接口
#
# 桌面版用的是 reqwest 默认的 native-tls；安卓上这条路会拉进 openssl-sys，
# 需要先把 OpenSSL 交叉编译到 aarch64 才能链接（本机也没有 cmake/perl/nasm）。
# 换成 rustls + ring：纯 Rust 加一点 C，用 NDK 的 clang 就能编，根证书走
# 内置的 webpki-roots，不依赖系统证书库。
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "socks",
    "rustls-tls",
    "http2",
    "charset",
] }
url = "2"
tokio = { version = "1", features = ["time"] }
thiserror = "2"

# 驱动抽象
async-trait = "0.1"

# 历史库：bundled 自带 SQLite 源码，不依赖系统库（安卓上同样如此，NDK 现场编译）
rusqlite = { version = "0.40", features = ["bundled"] }

# 导出时格式化本地时间
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
# 注意：这里没有 `panic = "abort"`。安卓侧要经过 JNI 边界，abort 会让
# 任何一次 panic 直接杀掉整个应用进程，调试期非常难定位。
